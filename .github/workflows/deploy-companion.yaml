name: Deploy Companion

permissions:
  contents: read

concurrency:
  group: deploy-companion-${{ github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "*-companion"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            artifact: macos
          - os: windows-latest
            artifact: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: package/tauri

      - name: Package installer
        shell: bash
        run: bash scripts/package.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            package/tauri/target/**/bundle/dmg/*.dmg
            package/tauri/target/**/bundle/nsis/*-setup.exe

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$(find dist -type f -name '*.dmg' -print -quit)"
          exe="$(find dist -type f -name '*-setup.exe' -print -quit)"
          if [ -z "$dmg" ] || [ -z "$exe" ]; then
            echo "ERROR: expected a macOS DMG and a Windows setup.exe." >&2
            find dist -type f -print
            exit 1
          fi

          mkdir -p release
          cp "$dmg" release/AICompanion-macos-aarch64.dmg
          cp "$exe" release/AICompanion-windows-x64-setup.exe

          tag="${GITHUB_REF_NAME}"
          echo "Publishing $tag"

          notes="$(printf '%s\n' \
            'macOS (Apple Silicon) and Windows (x64) installers.' \
            '' \
            'These builds are not code-signed, so the OS warns on first launch.' \
            '' \
            'macOS: drag AICompanion from the DMG into Applications, then clear the quarantine flag once:' \
            '' \
            '  xattr -dr com.apple.quarantine /Applications/AICompanion.app' \
            '' \
            'Or use System Settings > Privacy & Security > Open Anyway. Right-click > Open does not bypass this on macOS 15+.' \
            '' \
            'Windows: if SmartScreen shows "Windows protected your PC", choose More info > Run anyway.')"

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI Companion $tag" \
            --notes "$notes" \
            release/AICompanion-macos-aarch64.dmg \
            release/AICompanion-windows-x64-setup.exe
